name: Build image

# Builds the Owlet→RTSP bridge image and publishes it to GHCR so the Unraid
# template / docker run command can pull a ready-made image:
#
#   ghcr.io/<owner>/owlet-bridge-native

on:
  push:
    branches: ["**"]
    paths:
      - "native-bridge/bridge/**"
      - ".github/workflows/build-bridge.yml"
  workflow_dispatch:

jobs:
  test:
    # Stdlib-only unit tests for the self-heal ladder (watchdog.py). Fast, and
    # they gate the image build so a broken watchdog can't ship.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s native-bridge/bridge/tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # The native Owlet/Kalay bridge — Bionic (Termux) runtime so the
          # Android TUTK libs actually load on x86_64.
          - name: owlet-bridge-native
            context: ./native-bridge/bridge
            dockerfile: ./native-bridge/bridge/Dockerfile.bionic
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-arm64-beta:
    # arm64 variant of the bionic bridge, built under QEMU. Beta-only: used to
    # test the ARM TUTK libs (same SDK version as the phone) on Unraid via
    # qemu-user, to discriminate an x86_64-lib limitation from an environment one.
    if: github.ref == 'refs/heads/beta'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push arm64 beta
        uses: docker/build-push-action@v6
        with:
          context: ./native-bridge/bridge
          file: ./native-bridge/bridge/Dockerfile.bionic
          platforms: linux/arm64
          build-args: |
            TERMUX_TAG=aarch64
            TUTK_ARCH=arm64-v8a
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/owlet-bridge-native:beta-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
